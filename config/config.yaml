# MYCONFIG
#16s_insomnia/config/config.yaml
project:
  seed: 610

columns:
  otu_id: "OTU"
  sample_id: "sample-id"
  group: "group"

groups:
  levels: ["Control", "Insomnia"]
  colors:
    Control: "#2b5c8f"
    Insomnia: "#d95f02"

input:
  taxonomy: "data/pre_processed/unified/taxonomy.tsv"
  otu: "data/pre_processed/unified/unified_otu_table.tsv"
  metadata: "data/pre_processed/unified/master_metadata_unified.tsv"
  picrust_ko: "outputs/tables/merged_KO_metagenome.tsv"

outputs:
  dir: "outputs"

analysis:
  alpha:
    measures: ["Shannon", "Simpson"]
    test: "t.test"
  beta:
    distance: "bray"
    permanova_permutations: 999
    covariates: ["study_id", "sex", "age"]
  fb_ratio:
    phylum_a: "Firmicutes"
    phylum_b: "Bacteroidota"

differential:
  boruta:
    maxRuns: 100
    doTrace: 2
    covariates: ["study_id", "age"]
    otu_prefix: "OTU_"
  maaslin2:
    fixed_effects: ["group", "study_id", "age"]
    output_dir: "maaslin2"
  dbrda:
    distance: "bray"
    condition_covariates: ["study_id", "age"]
    scope_covariates: ["age", "sex", "study_id"]
    prevalence_min: 0.05
    permutations: 999
  lefse:
    group: "group"
    rank_filter: "Genus" #was "Species"
    p_max: 0.05
    lda_min: 2
    drop_tax_pattern: "s__other"

function:
  inputs:
    ko_edges: "outputs/function/tables/taxon_ko_edges_filtered.csv" #
      #ko_edges: "outputs/tables/cytoscape_edges.csv"      # Points to your output edges file
      #The original authors' cytoscape_edges.csv was just their manual export of the filtered correlation table so they could open it in Cytoscape.
      #In your pipeline, 10_function_taxa_ko_cor.R is the script that generates the exact same data. It outputs outputs/function/tables/taxon_ko_edges_filtered.csv.

    picrust_ko: "outputs/tables/merged_KO_metagenome.tsv"  # Points to your PICRUSt2 KO table
  transform:          # <-- Agrega esta sección
    log_base: 2       # o exp (según prefieras)
    pseudocount: 1  
  
  target_taxa:
    genus:
      - "g__Burkholderia-Caballeronia-Paraburkholderia"
      - "g__Bilophila"
      - "g__Lachnoclostridium"
      - "g__[Ruminococcus]_gnavus_group"
      - "g__Coprococcus"
    species:
      - "s__Bacteroides_vulgatus"
      - "s__Bacteroides_caccae"
      - "s__Ruminococcus_callidus"

  correlation:
    method: "spearman" # Ensure correlation method is explicitly defined here if needed by script 10
    p_max: 0.05
    abs_rho_min: 0.5
    fdr: "BH" # Matches script 10's fdr_method call


##NEW
function_contrib:
  inputs:
    metadata_for_taxa:   "outputs/tables/metadata_for_taxa.csv"
    taxonomy_filled:     "outputs/tables/picrust_taxonomy_filled.csv"
    ko_contrib_filtered: "outputs/tables/ko_contrib_filtered.csv"
    cytoscape_edges:     "outputs/function/tables/taxon_ko_edges_filtered.csv"
    ko_fc_group:         "outputs/tables/KO_FC_group.csv"
  output:
    dir: "outputs/function_contrib"
  plot:
    base_size: 11
  targets:
    taxa:
      - "g__Burkholderia-Caballeronia-Paraburkholderia"
      - "g__Bilophila"
      - "g__Lachnoclostridium"
      - "g__[Ruminococcus]_gnavus_group"
      - "g__Coprococcus"

